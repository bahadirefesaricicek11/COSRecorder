[package]
name = "cosrecorder"
version = "3.0.0"
description = "High-Performance 120 FPS Screen Recorder with CRF Compression"
authors = ["you"]
edition = "2021" # Not: Rust stable/nightly standartlarında 2021 edition uyumluluğu daha yüksektir

[lib]
name = "cosrecorder_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
tauri-plugin-notification = "2"
tauri-plugin-global-shortcut = "2.4.1"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.18.2"
hound = "3.5.1"
crossbeam-channel = "0.5.11"
tokio = { version = "1.36", features = ["time", "macros"] }
chrono = "0.4"
fs2 = "0.4"
log = "0.4"
simplelog = "0.12"

# Windows API bağımlılıklarının devasa feature gruplarını dışarıda tutmak için kısıtlama
[dependencies.winreg]
version = "0.56.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[profile.dev]
incremental = true
opt-level = 0
debug = 0 # Debug sembollerini 0 yaparak derleyici RAM kullanımını %60 düşürür
